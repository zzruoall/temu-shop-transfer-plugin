<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>导出 Temu 页面结构诊断</title>
    <style>
        body{margin:0;background:#f5f7fb;color:#1f2937;font:14px/1.7 Arial,"Microsoft YaHei",sans-serif}
        main{max-width:900px;margin:42px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(15,23,42,.12)}
        h1{margin:0 0 12px;font-size:21px}.status{padding:14px;border-radius:9px;background:#eef2ff;color:#4338ca;white-space:pre-wrap}
        .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.item{padding:11px;border:1px solid #e5e7eb;border-radius:9px;background:#fafafa}.label{color:#64748b;font-size:12px}.value{display:block;margin-top:3px;font-weight:700;word-break:break-word}
        .detail{margin-top:14px;color:#64748b;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}.json{margin-top:14px;padding:14px;background:#0f172a;color:#dbeafe;border-radius:9px;white-space:pre-wrap;word-break:break-word;max-height:500px;overflow:auto;font:12px/1.5 Consolas,monospace}
        button{margin:18px 8px 0 0;border:0;border-radius:8px;padding:9px 18px;background:#4f46e5;color:#fff;cursor:pointer}.secondary{background:#e0e7ff;color:#3730a3}
        @media(max-width:650px){main{margin:15px;padding:18px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>
</head>
<body>
<main>
    <h1>Temu 页面结构诊断</h1>
    <div id="status" class="status">正在读取最近一次页面结构…</div>
    <div id="summary" class="summary"></div>
    <div id="detail" class="detail"></div>
    <button id="download" disabled>下载页面结构 JSON</button>
    <button id="refresh" class="secondary">重新读取</button>
    <pre id="json" class="json">暂无诊断数据</pre>
</main>
<script src="structure.js"></script>
</body>
</html>
