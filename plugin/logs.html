<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>导出插件操作日志</title>
    <style>
        body{margin:0;background:#f5f7fb;color:#1f2937;font:14px/1.7 Arial,"Microsoft YaHei",sans-serif}
        main{max-width:720px;margin:60px auto;padding:30px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(15,23,42,.12)}
        h1{margin:0 0 12px;font-size:21px}.status{padding:14px;border-radius:9px;background:#eef2ff;color:#4338ca}.detail{margin-top:14px;color:#64748b;white-space:pre-wrap}
        button{margin:18px 8px 0 0;border:0;border-radius:8px;padding:9px 18px;background:#4f46e5;color:#fff;cursor:pointer}.danger{background:#fff1f2;color:#be123c}
    </style>
</head>
<body>
<main>
    <h1>导出插件操作日志</h1>
    <p>包含采集、连接、任务领取、按钮操作及状态变化。仅记录插件可观察的事件，不包含令牌和商品原始正文。</p>
    <div id="status" class="status" role="status">正在读取操作日志…</div>
    <div id="detail" class="detail"></div>
    <button id="download">重新导出日志</button>
</main>
<script src="logs.js"></script>
</body>
</html>
