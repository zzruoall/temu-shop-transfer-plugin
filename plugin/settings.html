<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中转仓与店铺设置</title>
    <style>
        body{margin:0;background:#f5f7fb;color:#1f2937;font:14px/1.7 Arial,"Microsoft YaHei",sans-serif}
        main{max-width:680px;margin:48px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(15,23,42,.12)}
        h1{margin:0 0 8px;font-size:21px}
        .lede{margin:0 0 18px;color:#64748b}
        label{display:block;margin:12px 0 6px;font-weight:700}
        input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d5e2ef;border-radius:8px;font:13px/1.5 Consolas,monospace}
        .row{display:flex;align-items:center;gap:8px;margin-top:12px}
        .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
        button{border:0;border-radius:8px;padding:9px 16px;background:#0b74de;color:#fff;cursor:pointer}
        button.secondary{background:#e6f2ff;color:#155d96}
        .status{margin-top:16px;padding:12px;border-radius:9px;background:#eef2ff;color:#4338ca;min-height:24px}
        .hint{margin-top:10px;color:#64748b;font-size:12px}
    </style>
</head>
<body>
<main>
    <h1>中转仓与店铺设置</h1>
    <p class="lede">采集结束后把完整包推到中转仓。插件会自动识别当前 Temu 页面店名并公开只读状态；紫鸟店铺 ID 由本机工人对照 store list 补齐，不必再手工绑定。</p>
    <label for="endpoint">中转仓地址</label>
    <input id="endpoint" type="text" spellcheck="false" placeholder="http://127.0.0.1:18380/api/ingest">
    <label for="token">直推令牌</label>
    <input id="token" type="password" spellcheck="false" autocomplete="off">
    <div class="row">
        <input id="autoPush" type="checkbox">
        <label for="autoPush" style="margin:0;font-weight:500">采集结束后自动推送完整包（可选；默认手动上传）</label>
    </div>
    <label for="storeId">当前紫鸟店铺 ID（可选，通常由工人自动补齐）</label>
    <input id="storeId" type="text" spellcheck="false" placeholder="留空即可，由中转仓按店名映射">
    <label for="storeName">店铺名称（可选）</label>
    <input id="storeName" type="text" spellcheck="false" placeholder="留空即可，插件会读取当前页店名">
    <div class="actions">
        <button id="save">保存并授权访问</button>
        <button id="test" class="secondary">测试连接</button>
        <button id="push" class="secondary">立即推送当前完整包</button>
    </div>
    <div id="status" class="status">正在读取本地设置…</div>
    <p class="hint">本机中转仓默认地址是 http://127.0.0.1:18380/api/ingest。紫鸟通常访问不到这台电脑的 127.0.0.1，应改填中转仓首页给出的局域网地址和令牌。</p>
    <p class="hint">不要从 Temu 商品 SPU 猜测店铺 ID。插件只公开版本、实例、页面店名和采集进度；上传令牌和商品正文不会写到页面。</p>
</main>
<script src="settings.js"></script>
</body>
</html>
