<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店铺中转仓</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- 商品库负责收存和发送；店铺在线、绑定及认领由独立目录维护。 -->
<div class="app">
    <aside class="rail">
        <div class="mark">中转仓<small>先入库，再指定店铺</small></div>
        <nav class="nav">            <a href="#/products" data-nav="products">商品库</a>
            <a href="#/stores" data-nav="stores">店铺认领</a>            <!-- 管理站是独立页面：跳出去而不是本页切路由，管理员界面与业务界面彻底分开。 -->
            <a href="./admin" id="nav-admin" hidden>管理控制台</a>
        </nav>
        <div class="rail-account" id="rail-account" hidden>
            <div class="rail-account-copy"><strong id="rail-username">—</strong><span id="rail-role"></span></div>
            <button type="button" class="rail-logout" id="rail-logout">退出登录</button>
        </div>
    </aside>
    <main class="stage" id="app"></main>
</div>
<script src="./product-detail.js"></script>
<script src="./product-error-ui.js"></script>
<script src="./app.js"></script>
</body>
</html>
